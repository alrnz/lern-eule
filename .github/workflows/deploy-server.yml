# Lädt server/backup.php auf das Hosting (https://lern-eule.lrnz.net/backup.php).
# Die App selbst kommt weiter über GitHub Pages. Gespeicherte Spielstände werden nicht angefasst.
# Secret DEPLOY_SSH_KEY: privater Teil des Deploy-Schlüssels (öffentlicher Teil liegt im Mittwald-Panel).
name: Server-Skript deployen
on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/deploy-server.yml']
  workflow_dispatch:
concurrency: deploy-server
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HOST: p717054.mittwaldserver.info
      USER: p717054
      DIR: html
    steps:
      - uses: actions/checkout@v4
      - name: PHP-Syntax prüfen
        run: php -l server/backup.php
      - name: SSH einrichten
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          echo "$HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKIKfWP7vPr4BXVpI3QJE1z8BnKWhb0y7OWAStOkB5Ji" > ~/.ssh/known_hosts
      - name: backup.php hochladen
        run: |
          SSH="ssh -i $HOME/.ssh/deploy -o IdentitiesOnly=yes"
          scp -i ~/.ssh/deploy -o IdentitiesOnly=yes server/backup.php "$USER@$HOST:$DIR/backup.php.new"
          $SSH "$USER@$HOST" "mv '$DIR/backup.php.new' '$DIR/backup.php' && ls -l '$DIR/backup.php'"
      - name: Prüfen
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://alrnz.github.io' -d '{"action":"get","id":"TEST-TEST-000"}' https://lern-eule.lrnz.net/backup.php)
          echo "Antwort: $code (404 = läuft, Code unbekannt)"
          test "$code" = 404
